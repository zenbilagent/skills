# Static HTML'i nginx ile serve etmek için Docker Compose template.
# HTML_CONTENT env var'ı ile HTML dosyasının içeriğini base64 olarak geçir.
# Komut: container başlarken base64 decode edip nginx'in html dizinine yazar.
#
# DOKPLOY UYARISI: compose command içinde $ kullanacaksan $$ ile escape et.
# Ama bu yöntem güvenilir değil — büyük HTML'lerde timeout olabilir.
# Daha güvenli alternatif: Dockerfile build ile image içine göm.
#
# Kullanım (Dokploy API):
#   from dokploy_api import DokployClient
#   import base64
#   client = DokployClient()
#   
#   with open("/opt/data/projects/my-app/index.html", "rb") as f:
#       html_b64 = base64.b64encode(f.read()).decode()
#   
#   compose = f"""version: '3.8'
#   services:
#     web:
#       image: nginx:alpine
#       environment:
#         - HTML_B64={html_b64}
#       command: sh -c "echo $$HTML_B64 | base64 -d > /usr/share/nginx/html/index.html && exec nginx -g 'daemon off;'"
#   """

version: '3.8'

services:
  web:
    image: nginx:alpine
    ports:
      - "80:80"
    environment:
      - HTML_B64=REPLACE_WITH_BASE64_ENCODED_HTML
    command: >
      sh -c "echo $$HTML_B64 | base64 -d > /usr/share/nginx/html/index.html && exec nginx -g 'daemon off;'"
